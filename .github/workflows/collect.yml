# 매일 새벽 2시(한국 시간)에 LCK 경기 데이터를 수집합니다.
# GitHub 저장소 > Settings > Secrets and variables > Actions 에 아래 4개 값을 등록해야 합니다.
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, LEAGUEPEDIA_BOT_USER, LEAGUEPEDIA_BOT_PASSWORD
name: Collect LCK data

on:
  schedule:
    - cron: '0 17 * * *' # UTC 17:00 = 한국 시간 02:00
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
      LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Leaguepedia (일정·결과·세트·선수 기록)
        run: npm run collect
      - name: LoL Esports (골드 그래프·팀 로고)
        run: npm run collect:timeline
      - name: 승부예측 (선수 Elo)
        run: npm run predict
